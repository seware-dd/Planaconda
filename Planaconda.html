<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gantt Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/@sigmacomputing/plugin"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      background: #fff;
      color: #1a1a2e;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Layout ── */
    #gantt {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left label column ── */
    #labels {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid #e0e0e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .label-header {
      height: 48px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-weight: 600;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: #fafafa;
    }

    #label-rows {
      overflow-y: auto;
      flex: 1;
    }

    .label-row {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #f0f0f0;
      gap: 6px;
    }

    .label-row.group {
      background: #f5f5f5;
      font-weight: 600;
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .label-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Right chart area ── */
    #chart {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    #chart-inner {
      position: relative;
    }

    /* ── Time header ── */
    #time-header {
      height: 48px;
      position: sticky;
      top: 0;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      z-index: 5;
      display: flex;
      flex-direction: column;
    }

    .th-months {
      height: 20px;
      display: flex;
      border-bottom: 1px solid #e0e0e0;
    }

    .th-month {
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 600;
      color: #999;
      border-right: 1px solid #e0e0e0;
      text-transform: uppercase;
      letter-spacing: .05em;
      overflow: hidden;
      white-space: nowrap;
    }

    .th-weeks {
      height: 28px;
      display: flex;
      align-items: center;
    }

    .th-week {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #aaa;
      border-right: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    .th-week.today { color: #f5a623; font-weight: 700; }

    /* ── Grid rows ── */
    .chart-row {
      height: 36px;
      border-bottom: 1px solid #f0f0f0;
      position: relative;
    }

    .chart-row.group { background: #f9f9f9; }

    /* ── Today line ── */
    .today-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #f5a623;
      opacity: .7;
      z-index: 3;
    }

    /* ── Bars ── */
    .bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 20px;
      border-radius: 3px;
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      overflow: hidden;
      min-width: 4px;
    }

    .bar:hover { filter: brightness(.9); }

    .bar-progress {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      opacity: .4;
    }

    .bar-text {
      position: relative;
      padding: 0 6px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
    }

    .milestone {
      position: absolute;
      top: 50%;
      width: 12px; height: 12px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 2px;
      z-index: 3;
      cursor: pointer;
    }

    /* ── Tooltip ── */
    #tip {
      position: fixed;
      background: #1a1a2e;
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity .1s;
      line-height: 1.7;
      max-width: 220px;
    }
    #tip.show { opacity: 1; }
    #tip strong { font-size: 12px; display: block; margin-bottom: 2px; }

    /* ── Empty / Error ── */
    #empty {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #aaa;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    #empty.show { display: flex; }
  </style>
</head>
<body>

<div id="gantt">
  <div id="labels">
    <div class="label-header">Task</div>
    <div id="label-rows"></div>
  </div>
  <div id="chart">
    <div id="chart-inner">
      <div id="time-header">
        <div class="th-months"></div>
        <div class="th-weeks"></div>
      </div>
      <div id="chart-rows"></div>
    </div>
  </div>
</div>

<div id="empty" class="show">
  <div style="font-size:32px">📋</div>
  <div>Configure the plugin columns<br>in the editor panel to show your data.</div>
</div>

<div id="tip"></div>

<script>
const COL_W = 90; // px per week

// ── Register with Sigma ────────────────────────────────
sigma.initialize({
  id: 'gantt-chart'
});

sigma.config.configureEditorPanel([
  {
    name: 'source',
    type: 'element',
    label: 'Data Source'
  },
  {
    name: 'col_name',
    type: 'column',
    label: 'Task Name',
    source: 'source',
    allowedTypes: ['text']
  },
  {
    name: 'col_start',
    type: 'column',
    label: 'Start Date',
    source: 'source',
    allowedTypes: ['datetime', 'date', 'text']
  },
  {
    name: 'col_end',
    type: 'column',
    label: 'End Date',
    source: 'source',
    allowedTypes: ['datetime', 'date', 'text']
  },
  {
    name: 'col_status',
    type: 'column',
    label: 'Status (optional)',
    source: 'source',
    allowedTypes: ['text'],
    optional: true
  },
  {
    name: 'col_owner',
    type: 'column',
    label: 'Owner / Team (optional)',
    source: 'source',
    allowedTypes: ['text'],
    optional: true
  },
  {
    name: 'col_group',
    type: 'column',
    label: 'Group / Category (optional)',
    source: 'source',
    allowedTypes: ['text'],
    optional: true
  },
  {
    name: 'col_progress',
    type: 'column',
    label: 'Progress % (optional)',
    source: 'source',
    allowedTypes: ['number', 'integer'],
    optional: true
  },
  {
    name: 'col_milestone',
    type: 'column',
    label: 'Milestone flag (optional)',
    source: 'source',
    allowedTypes: ['boolean', 'text', 'number'],
    optional: true
  }
]);

// ── State ──────────────────────────────────────────────
let cfg = {};
let rows = [];

// ── Listen for config + data changes ──────────────────
sigma.config.subscribe((newCfg) => {
  cfg = newCfg;
  render();
});

sigma.data.subscribe((data) => {
  rows = data || [];
  render();
});

// ── Helpers ────────────────────────────────────────────
function fv(row, key) {
  const col = cfg[key];
  return col ? row[col] : null;
}

const STATUS_COLORS = {
  'done':        '#3ecf8e',
  'complete':    '#3ecf8e',
  'completed':   '#3ecf8e',
  'in progress': '#4a90e2',
  'active':      '#4a90e2',
  'planned':     '#aaa',
  'not started': '#aaa',
  'blocked':     '#e25c5c',
  'at risk':     '#f5a623',
};

function colorFor(status) {
  if (!status) return '#4a90e2';
  return STATUS_COLORS[status.toLowerCase()] || '#4a90e2';
}

function parseDate(v) {
  if (!v) return null;
  // Handle Sigma date objects or ISO strings
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate() + n); return r;
}

function startOfWeek(d) {
  const r = new Date(d);
  r.setHours(0,0,0,0);
  r.setDate(r.getDate() - r.getDay());
  return r;
}

function weeksBetween(a, b) {
  return (b - a) / (7 * 24 * 3600 * 1000);
}

function fmt(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── Render ─────────────────────────────────────────────
function render() {
  const hasData = rows.length > 0 && cfg.col_name && cfg.col_start && cfg.col_end;

  document.getElementById('gantt').style.display  = hasData ? 'flex' : 'none';
  document.getElementById('empty').classList.toggle('show', !hasData);
  if (!hasData) return;

  // Parse rows
  const tasks = rows.map(r => ({
    name:      fv(r, 'col_name')      || '',
    start:     parseDate(fv(r, 'col_start')),
    end:       parseDate(fv(r, 'col_end')),
    status:    fv(r, 'col_status')    || '',
    owner:     fv(r, 'col_owner')     || '',
    group:     fv(r, 'col_group')     || '',
    progress:  parseFloat(fv(r, 'col_progress')) || 0,
    milestone: (() => { const v = fv(r, 'col_milestone'); return v === true || v === 1 || v === 'true' || v === '1'; })()
  })).filter(t => t.name && (t.start || t.end));

  if (tasks.length === 0) return;

  // Date range
  const allDates = tasks.flatMap(t => [t.start, t.end]).filter(Boolean);
  const minDate  = startOfWeek(addDays(new Date(Math.min(...allDates)), -7));
  const maxDate  = new Date(Math.max(...allDates));
  maxDate.setDate(maxDate.getDate() + 21);
  const maxWeek  = startOfWeek(maxDate);

  // Week columns
  const weeks = [];
  let cur = new Date(minDate);
  while (cur <= maxWeek) {
    weeks.push(new Date(cur));
    cur.setDate(cur.getDate() + 7);
  }
  const totalW = weeks.length * COL_W;

  // Group tasks
  const useGroup = !!cfg.col_group;
  const groups = {};
  tasks.forEach(t => {
    const g = useGroup ? (t.group || 'Other') : '__all__';
    if (!groups[g]) groups[g] = [];
    groups[g].push(t);
  });

  // Build display rows
  const displayRows = [];
  Object.entries(groups).forEach(([gname, gtasks]) => {
    if (useGroup) displayRows.push({ type: 'group', name: gname });
    gtasks.forEach(t => displayRows.push({ type: 'task', task: t }));
  });

  // ── Header ──
  const today = new Date();
  const monthMap = {};
  weeks.forEach((w, i) => {
    const mk = `${w.getFullYear()}-${w.getMonth()}`;
    if (!monthMap[mk]) monthMap[mk] = { label: w.toLocaleDateString('en-US',{month:'short',year:'numeric'}), count: 0 };
    monthMap[mk].count++;
  });

  const monthsEl = document.querySelector('.th-months');
  monthsEl.innerHTML = Object.values(monthMap).map(m =>
    `<div class="th-month" style="width:${m.count * COL_W}px">${m.label}</div>`
  ).join('');

  const weeksEl = document.querySelector('.th-weeks');
  weeksEl.style.width = totalW + 'px';
  weeksEl.innerHTML = weeks.map(w => {
    const isToday = Math.abs(w - startOfWeek(today)) < 3600000;
    return `<div class="th-week${isToday?' today':''}" style="width:${COL_W}px">
      W${getWeekNum(w)}
    </div>`;
  }).join('');

  // ── Chart inner size ──
  document.getElementById('chart-inner').style.width = totalW + 'px';

  // ── Label rows ──
  document.getElementById('label-rows').innerHTML = displayRows.map(item => {
    if (item.type === 'group') {
      return `<div class="label-row group"><span class="label-name">${esc(item.name)}</span></div>`;
    }
    const t = item.task;
    const color = colorFor(t.status);
    return `<div class="label-row">
      <div class="dot" style="background:${color}"></div>
      <span class="label-name" title="${esc(t.name)}">${esc(t.name)}</span>
    </div>`;
  }).join('');

  // ── Chart rows ──
  const todayX = weeksBetween(minDate, startOfWeek(today)) * COL_W;

  document.getElementById('chart-rows').innerHTML = displayRows.map((item, i) => {
    if (item.type === 'group') {
      return `<div class="chart-row group" style="width:${totalW}px"></div>`;
    }
    const t = item.task;
    const color = colorFor(t.status);
    let barHtml = '';

    if (t.milestone && t.start) {
      const x = weeksBetween(minDate, t.start) * COL_W - 6;
      barHtml = `<div class="milestone" style="left:${x}px;background:${color}"
        onmouseenter="tip(event,'${esc(t.name)}','${fmt(t.start)}',null,'${esc(t.status)}','${esc(t.owner)}')"
        onmouseleave="hideTip()"></div>`;
    } else if (t.start && t.end) {
      const x = weeksBetween(minDate, t.start) * COL_W;
      const w = Math.max(weeksBetween(t.start, addDays(t.end, 1)) * COL_W, 4);
      barHtml = `<div class="bar" style="left:${x}px;width:${w}px;background:${color}"
        onmouseenter="tip(event,'${esc(t.name)}','${fmt(t.start)}','${fmt(t.end)}','${esc(t.status)}','${esc(t.owner)}',${t.progress})"
        onmouseleave="hideTip()">
        <div class="bar-progress" style="width:${t.progress}%;background:#fff"></div>
        <span class="bar-text">${esc(t.name)}</span>
      </div>`;
    }

    return `<div class="chart-row" style="width:${totalW}px">
      <div class="today-line" style="left:${todayX}px"></div>
      ${barHtml}
    </div>`;
  }).join('');
}

function getWeekNum(d) {
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Tooltip ────────────────────────────────────────────
function tip(e, name, start, end, status, owner, progress) {
  const el = document.getElementById('tip');
  el.innerHTML = `<strong>${name}</strong>
    ${start ? `Start: ${start}<br>` : ''}
    ${end   ? `End: ${end}<br>`   : ''}
    ${status ? `Status: ${status}<br>` : ''}
    ${owner  ? `Owner: ${owner}<br>`  : ''}
    ${progress != null ? `Progress: ${progress}%` : ''}`;
  el.classList.add('show');
  move(e);
}

function hideTip() { document.getElementById('tip').classList.remove('show'); }

function move(e) {
  const el = document.getElementById('tip');
  el.style.left = Math.min(e.clientX + 12, window.innerWidth - 230) + 'px';
  el.style.top  = Math.min(e.clientY + 12, window.innerHeight - 120) + 'px';
}

document.addEventListener('mousemove', e => {
  if (document.getElementById('tip').classList.contains('show')) move(e);
});
</script>
</body>
</html>
